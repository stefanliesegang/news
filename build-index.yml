name: Build Daily News Index

on:
  push:
    branches: [main]
    paths:
      - "news/*.md"
      - "generate_index.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate index.md
        env:
          NEWS_DIR: news
          OUTPUT: index.md
          SITE_TITLE: "News-Übersicht"
        run: python generate_index.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.md; then
            echo "index.md unverändert – kein Commit nötig."
          else
            git add index.md
            git commit -m "chore: update news index [skip ci]"
            git push
          fi
